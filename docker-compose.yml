# Local production-parity stack: API + Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: growpod
      POSTGRES_PASSWORD: growpod
      POSTGRES_DB: growpod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growpod"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://growpod:growpod@db:5432/growpod"
      PORT: "10000"
    ports:
      - "10000:10000"

volumes:
  pgdata:
