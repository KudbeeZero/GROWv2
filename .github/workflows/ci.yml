name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      DATABASE_URL: "sqlite:///ci.db"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (syntax & undefined names)
        run: ruff check --select=E9,F63,F7,F82 src tests

      - name: Check memory integrity (links, ✅ citations, structure)
        run: python scripts/check_memory.py

      - name: Check single Alembic head (no migration forks)
        run: python scripts/check_single_head.py

      - name: Database migrations apply cleanly
        run: alembic upgrade head

      - name: Seed catalog (idempotent)
        run: python -m growpodempire.db.seed

      - name: Run tests (with coverage gate)
        run: python -m pytest -q --cov --cov-report=term-missing
